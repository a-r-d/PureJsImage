name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Clean checkout Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    # `npm run check` runs the fast test tier; the slow-tests job below runs the rest.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run clean-checkout validation
        run: npm run check

  slow-tests:
    name: Slow tests Node 22
    runs-on: ubuntu-latest
    # Exhaustive JPEG XL encoder searches that `npm run check` leaves out; see vitest.config.ts.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run slow test tier
        run: npm run test:slow

  benchmark-lane-types:
    name: Benchmark lane types
    runs-on: ubuntu-latest
    # The viewer and scientific competitor harnesses import packages that only their pinned lane
    # installs provide, so the root `npm run typecheck` skips those files.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            benchmark/competitors-js/package-lock.json
            benchmark/viewers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install pinned benchmark lanes
        run: |
          npm ci --prefix benchmark/competitors-js --ignore-scripts --no-fund --no-audit
          npm ci --prefix benchmark/viewers --ignore-scripts --no-fund --no-audit

      - name: Type-check benchmark lanes
        run: npm run typecheck:lanes

  browser:
    name: Browser ${{ matrix.browser }}
    runs-on: ubuntu-latest
    # Include setup, compatibility cases and both ten-minute photo attempts.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install current browsers
        run: npx --no-install playwright install --with-deps chrome firefox webkit

      - name: Build package for executable public examples
        run: npm run build

      # Wikimedia rate-limits shared runners, so keep the checksum-pinned photo in the Actions cache.
      - name: Restore pinned JPEG XL workbench input
        id: tundra-cache
        uses: actions/cache/restore@v6
        with:
          path: benchmark/corpus/files/tundra-4000x3000.jpg
          key: corpus-tundra-4000x3000-af55711534d744a385a805d7c0ff20c7e32c19f9fb886b468b078af24ddb8ab6

      - name: Prepare pinned JPEG XL workbench input
        run: npm run fixtures:prepare -- tundra-4000x3000

      - name: Save pinned JPEG XL workbench input
        if: steps.tundra-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: benchmark/corpus/files/tundra-4000x3000.jpg
          key: corpus-tundra-4000x3000-af55711534d744a385a805d7c0ff20c7e32c19f9fb886b468b078af24ddb8ab6

      - name: Prepare pinned HDF5 browser fixture
        run: npm run fixtures:hdf5:prepare

      - name: Install pinned scientific browser competitors
        run: npm ci --prefix benchmark/competitors-js --no-fund --no-audit
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run browser compatibility gate
        id: browser-compatibility
        run: >-
          npm run browser:test -- --project=${{ matrix.browser }}
          --grep-invert 'JPEG XL (original-photo selection preserves independently verified samples|fine-photo policy preserves complete browser rows and opaque alpha)$'
          --output=test-results/compatibility

      - name: Run isolated JPEG XL photo fixtures
        if: ${{ !cancelled() && (steps.browser-compatibility.outcome == 'success' || steps.browser-compatibility.outcome == 'failure') }}
        run: >-
          npm run browser:test -- browser-tests/jpegxl-cone-selection.pw.ts browser-tests/jpegxl-fine-selection.pw.ts
          --project=${{ matrix.browser }} --workers=1
          --grep 'JPEG XL (original-photo selection preserves independently verified samples|fine-photo policy preserves complete browser rows and opaque alpha)$'
          --output=test-results/jpegxl-photo

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.browser }}-failure-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
