name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Clean checkout Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    # Compression-first effort-7 searches extend the full correctness suite.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run clean-checkout validation
        run: npm run check

  browser:
    name: Browser ${{ matrix.browser }}
    runs-on: ubuntu-latest
    # Include setup, compatibility cases and both ten-minute photo attempts.
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build package for executable public examples
        run: npm run build

      - name: Prepare pinned JPEG XL workbench input
        run: npm run fixtures:prepare -- tundra-4000x3000

      - name: Prepare pinned HDF5 browser fixture
        run: npm run fixtures:hdf5:prepare

      - name: Install pinned scientific browser competitors
        run: npm ci --prefix benchmark/competitors-js --no-fund --no-audit
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run browser compatibility gate
        id: browser-compatibility
        run: >-
          npm run browser:test -- --project=${{ matrix.browser }}
          --grep-invert 'JPEG XL (original-photo selection preserves independently verified samples|fine-photo policy preserves complete browser rows and opaque alpha)$'
          --output=test-results/compatibility

      - name: Run isolated JPEG XL photo fixtures
        if: ${{ !cancelled() && (steps.browser-compatibility.outcome == 'success' || steps.browser-compatibility.outcome == 'failure') }}
        run: >-
          npm run browser:test -- browser-tests/jpegxl-cone-selection.pw.ts browser-tests/jpegxl-fine-selection.pw.ts
          --project=${{ matrix.browser }} --workers=1
          --grep 'JPEG XL (original-photo selection preserves independently verified samples|fine-photo policy preserves complete browser rows and opaque alpha)$'
          --output=test-results/jpegxl-photo

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.browser }}-failure-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
