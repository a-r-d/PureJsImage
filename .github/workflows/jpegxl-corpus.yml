name: JPEG XL smoke

on:
  pull_request:
    paths:
      - '.github/workflows/jpegxl-corpus.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/jpegxl*'
      - 'benchmark/jpegxl/**'
      - 'capabilities/**'
      - 'docs/jpeg-xl.md'
      - 'docs/architecture/jpegxl*.md'
      - 'jpegxl-codec-support.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Conformance and hardening smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated JPEG XL baseline
        run: npm run jpegxl:program:baseline

      - name: Run pinned official conformance corpus
        env:
          CONFORMANCE_ARCHIVE_SHA256: 1e7954076edfe8c6f66354db5a7aa0ba76c99095d81564e8dbc76043caed37bd
          CONFORMANCE_REVISION: 4bf053529c7cefd2951be453475bb3dccc7e7be8
        run: |
          mkdir -p .tmp/jpegxl-conformance .tmp/jpegxl-smoke
          curl --fail --location \
            "https://github.com/libjxl/conformance/archive/$CONFORMANCE_REVISION.tar.gz" \
            --output .tmp/jpegxl-conformance.tar.gz
          echo "$CONFORMANCE_ARCHIVE_SHA256  .tmp/jpegxl-conformance.tar.gz" | sha256sum --check
          tar --extract --gzip --file .tmp/jpegxl-conformance.tar.gz \
            --directory .tmp/jpegxl-conformance --strip-components=1
          npm run jpegxl:program:conformance -- \
            --corpus-root .tmp/jpegxl-conformance \
            --output .tmp/jpegxl-smoke/conformance.json

      - name: Run focused hardening smoke
        run: |
          npm run jpegxl:m9:integration -- --output .tmp/jpegxl-smoke/m9-integration.json
          npm run jpegxl:m9:fuzz-resource -- --output .tmp/jpegxl-smoke/m9-fuzz-resource.json
          npx vitest run tests/jpegxl-evidence.test.ts tests/jpegxl-m10-level10.test.ts
