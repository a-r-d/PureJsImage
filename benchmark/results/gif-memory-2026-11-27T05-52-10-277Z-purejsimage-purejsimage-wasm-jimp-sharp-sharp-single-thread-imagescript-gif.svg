    <text x="54" y="1836" class="footer">Absolute process RSS from isolated workers. PureJsImage WASM accelerates JPEG, PNG, and resize steps; GIF decoding, palettes, dithering, and GIF encoding run in TypeScript on both PureJsImage engines.</text>
